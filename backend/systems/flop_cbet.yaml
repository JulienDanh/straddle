name: "Flop Cbet Strategy"
description: "Continuation betting rules for the flop"
rules:
  - name: "cbet A-high flop BTN"
    conditions:
      street: flop
      board: A-high
      position: BTN
      pot: single-raised
      players: heads-up
    action:
      type: bet
      size: 0.66

  - name: "cbet monotone K-high flop"
    conditions:
      street: flop
      board:
        - K-high
        - monotone
      position: BTN
      pot: single-raised
    action:
      type: bet
      size: 0.75

  - name: "check back paired low board"
    conditions:
      street: flop
      board:
        - low
        - paired
      hand: high-card
      position: BTN
      pot: single-raised
    action:
      type: check

  - name: "shove set with low SPR"
    conditions:
      street: turn
      hand: set
      spr: "<2"
    action:
      type: raise
      size: all-in
